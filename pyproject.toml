[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bbnjax"
version = "0.1.0"
description = "BBN-JAX: Differentiable, uncertainty-aware, active-learning machine-learning emulators for Big Bang Nucleosynthesis built on LINX."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "BBN-JAX Authors" },
]
keywords = [
    "cosmology",
    "big bang nucleosynthesis",
    "bbn",
    "emulator",
    "surrogate model",
    "jax",
    "equinox",
    "gaussian process",
    "active learning",
    "uncertainty quantification",
    "differentiable",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "equinox>=0.11.4",
    "optax>=0.2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
linx = ["linx"]
gp = ["tinygp>=0.3"]
mcmc = ["blackjax>=1.2"]
cobaya = ["cobaya>=3.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
all = ["tinygp>=0.3", "blackjax>=1.2"]

[project.urls]
Homepage = "https://github.com/your-org/bbn-jax"
Repository = "https://github.com/your-org/bbn-jax"
Documentation = "https://github.com/your-org/bbn-jax/tree/main/docs"

[project.scripts]
bbnjax-generate = "bbnjax.data.generate:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bbnjax = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "NPY"]
ignore = ["E741", "B008"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
